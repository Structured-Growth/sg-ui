name: CI
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact development commit to validate without publishing
        required: false
        default: ''
        type: string
  pull_request:
    branches-ignore: [dev]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact proposal commit to validate; empty uses the triggering ref
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  validate:
    name: Validate Node ${{ matrix.node }}
    needs: native
    if: always() && (github.event_name != 'pull_request' || github.base_ref != 'dev')
    runs-on: ubuntu-latest
    # Browser engines run separately; named runtime checks require all engines.
    timeout-minutes: ${{ matrix.node == '24' && 60 || 30 }}
    defaults:
      run:
        shell: bash
        working-directory: packages/ui
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact checked head
        env:
          EXPECTED_HEAD: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_HEAD"
          echo "Validated checkout: $actual" >> "$GITHUB_STEP_SUMMARY"
        working-directory: .
      - name: Require every native engine
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$NATIVE_RESULT" = success
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Remove generated validation output and fingerprint inputs
        run: node scripts/ci-artifacts.mjs begin
      - name: Record validation runtime
        run: |
          mkdir -p artifacts/logs
          node --version | tee artifacts/logs/node.txt
          pnpm --version | tee artifacts/logs/pnpm.txt
      - name: Validate artifact freshness guards
        run: node --test scripts/ci-artifacts.test.mjs 2>&1 | tee artifacts/logs/artifact-guards.txt
      - name: Validate CI routing and release evidence guards
        run: node --test scripts/check-ci-release-enforcement.test.mjs scripts/verify-ci-downloads.test.mjs 2>&1 | tee artifacts/logs/release-enforcement.txt
      - name: Package and behavior checks
        run: pnpm check 2>&1 | tee artifacts/logs/check.txt
      - name: Build native docs fixtures
        run: pnpm build:browser-docs 2>&1 | tee artifacts/logs/browser-docs.txt
      # Each job has its own runner; the native matrix cannot provision these
      # packed SSR/hydration and Next.js consumer browsers for the runtime job.
      - name: Install packed consumer browsers
        if: matrix.node == '24'
        run: pnpm exec playwright install --with-deps chromium firefox webkit 2>&1 | tee artifacts/logs/consumer-browsers.txt
      # Do not rebuild dist while these fixtures pack it. Vite SSR also shares a
      # port, so React versions and foundation/editor fixtures run serially.
      - name: Packed React 18.3 foundation consumer
        run: node scripts/test-foundation-consumer.mjs --react18 ${{ matrix.node == '24' && '--browser' || '' }} 2>&1 | tee artifacts/logs/foundation-react18.txt
      - name: Packed React 19 foundation and Flight consumer
        run: node scripts/test-foundation-consumer.mjs ${{ matrix.node == '24' && '--browser' || '' }} 2>&1 | tee artifacts/logs/foundation-react19.txt
      - name: Packed React 18.3 editor consumer
        run: node scripts/test-editor-consumer.mjs --react18 2>&1 | tee artifacts/logs/editor-react18.txt
      - name: Packed React 19 editor consumer
        run: node scripts/test-editor-consumer.mjs 2>&1 | tee artifacts/logs/editor-react19.txt
      - name: Packed Next.js production and browser consumer
        if: matrix.node == '24'
        run: node scripts/test-next-consumer.mjs 2>&1 | tee artifacts/logs/next-consumer.txt
      - name: Download native build receipts
        if: matrix.node == '24'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sgui-native-*-node-24
          path: /tmp/sgui-native-ci
      - name: Pack validated package
        run: pnpm pack --pack-destination artifacts
      - name: Verify native engine scope and compiled package identity
        if: matrix.node == '24'
        run: node scripts/verify-native-ci.mjs /tmp/sgui-native-ci
      - name: Bind fresh outputs and tarball to validated inputs
        run: node scripts/ci-artifacts.mjs complete
      - name: Upload validated package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sgui-package-node-${{ matrix.node }}
          path: packages/ui/artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
      - name: Upload validated native docs fixtures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sgui-browser-docs-node-${{ matrix.node }}
          path: packages/ui/browser-docs-static/
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser evidence
        if: always() && matrix.node == '24'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sgui-browser-node-24
          path: |
            packages/ui/artifacts/browser-report/
            packages/ui/artifacts/browser-traces/
            packages/ui/artifacts/browser-results.json
            packages/ui/artifacts/packed-browser/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sgui-validation-node-${{ matrix.node }}
          path: packages/ui/artifacts/logs/
          if-no-files-found: warn
          retention-days: 14

  native:
    name: Native ${{ matrix.browser }}
    if: github.event_name != 'pull_request' || github.base_ref != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: packages/ui
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      SGUI_NATIVE_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact checked head
        env:
          EXPECTED_HEAD: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_HEAD"
          echo "Validated checkout: $actual" >> "$GITHUB_STEP_SUMMARY"
        working-directory: .
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Remove generated validation output and fingerprint inputs
        run: node scripts/ci-artifacts.mjs begin
      - name: Build fresh public library
        run: pnpm build
      - name: Build native docs fixtures
        run: pnpm build:browser-docs
      - name: Install selected browser engine
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Record complete engine collection
        run: pnpm exec playwright test --list --project=${{ matrix.browser }} --reporter=json > artifacts/logs/browser-collection.json
      - name: Browser interactions, accessibility and performance smoke
        timeout-minutes: 45
        # Firefox's Linux headless clipboard may omit native custom MIME data.
        # Use a real X server for its native clipboard and retain every assertion.
        run: |
          if [ "${{ matrix.browser }}" = "firefox" ]; then
            xvfb-run --auto-servernum pnpm test:browser --project=firefox --headed 2>&1 | tee artifacts/logs/browser.txt
          else
            pnpm test:browser --project=${{ matrix.browser }} 2>&1 | tee artifacts/logs/browser.txt
          fi
      - name: Bind native build evidence
        run: |
          pnpm pack --pack-destination artifacts
          node scripts/ci-artifacts.mjs complete
      - name: Upload native engine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sgui-native-${{ matrix.browser }}-node-24
          path: |
            packages/ui/artifacts/logs/
            packages/ui/artifacts/browser-report/
            packages/ui/artifacts/browser-traces/
            packages/ui/artifacts/browser-results.json
          if-no-files-found: warn
          retention-days: 14

  docs:
    name: Next.js docs
    runs-on: ubuntu-latest
    # Run 39098705687 reached 233/245 browser cases before the 20m job limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact checked head
        env:
          EXPECTED_HEAD: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_HEAD"
          echo "Validated checkout: $actual" >> "$GITHUB_STEP_SUMMARY"
        working-directory: .
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Remove previous docs output and record runtime
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { rmSync, mkdirSync } from 'node:fs';
          for (const path of ['apps/docs/.next', 'apps/docs/artifacts', 'apps/docs/test-results', 'apps/docs/playwright-report']) rmSync(path, { recursive: true, force: true });
          mkdirSync('apps/docs/artifacts/logs', { recursive: true });
          JS
          node --version | tee apps/docs/artifacts/logs/node.txt
          pnpm --version | tee apps/docs/artifacts/logs/pnpm.txt
      - run: pnpm check:docs 2>&1 | tee apps/docs/artifacts/logs/check.txt
        shell: bash
      - run: pnpm build:docs 2>&1 | tee apps/docs/artifacts/logs/build.txt
        shell: bash
      - run: pnpm --filter @structured-growth/docs exec playwright install --with-deps chromium
      - run: pnpm --filter @structured-growth/docs test:e2e --reporter=list,json 2>&1 | tee apps/docs/artifacts/logs/browser.txt
        shell: bash
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/browser-results.json
      - name: Upload docs validation and failure traces
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sgui-docs-validation-node-24
          path: |
            apps/docs/artifacts/
            apps/docs/test-results/
          if-no-files-found: warn
          retention-days: 14
