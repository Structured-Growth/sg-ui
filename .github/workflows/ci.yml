name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  targeted-dev:
    name: Targeted development validation
    if: github.event_name == 'pull_request' && github.base_ref == 'codex/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select and validate changed development code
        shell: bash
        env:
          TASK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --check "$TASK_BASE_SHA"...HEAD
          sources=()
          tests=()
          browser=()
          code=false
          while IFS= read -r -d '' path; do
            case "$path" in
              src/*|scripts/*|package.json|pnpm-lock.yaml|tsconfig*|.storybook/*) code=true ;;
            esac
            [[ -f "$path" ]] || continue
            case "$path" in
              src/*.test.ts|src/*.test.tsx) tests+=("$path") ;;
              src/*.ts|src/*.tsx) sources+=("$path") ;;
              tests/browser/*.spec.ts) browser+=("$path") ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMRD -z "$TASK_BASE_SHA"...HEAD)
          if "$code"; then
            pnpm typecheck
            pnpm foundations:check
            pnpm tokens:check
          fi
          if (( ${#sources[@]} )); then
            pnpm exec vitest related --run --passWithNoTests "${sources[@]}"
          fi
          if (( ${#tests[@]} )); then
            pnpm exec vitest run "${tests[@]}"
          fi
          if (( ${#browser[@]} )); then
            pnpm build-storybook
            pnpm exec playwright install --with-deps chromium firefox webkit
            pnpm test:browser "${browser[@]}"
          fi
      - name: Upload targeted browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgui-dev-browser
          path: |
            artifacts/browser-report/
            artifacts/browser-traces/
            artifacts/browser-results.json
          if-no-files-found: ignore
          retention-days: 14
  validate:
    name: Validate Node ${{ matrix.node }}
    if: github.event_name != 'pull_request' || github.base_ref != 'codex/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record validation runtime
        run: |
          mkdir -p artifacts/logs
          node --version | tee artifacts/logs/node.txt
          pnpm --version | tee artifacts/logs/pnpm.txt
      - name: Package and behavior checks
        run: pnpm check 2>&1 | tee artifacts/logs/check.txt
      - name: Build Storybook
        run: pnpm build-storybook 2>&1 | tee artifacts/logs/storybook.txt
      - name: Install browser engines
        if: matrix.node == '24'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Browser interactions, accessibility and performance smoke
        if: matrix.node == '24'
        run: pnpm test:browser 2>&1 | tee artifacts/logs/browser.txt
      # Do not rebuild dist while these fixtures pack it. Vite SSR also shares a
      # port, so React versions and foundation/editor fixtures run serially.
      - name: Packed React 18.3 foundation consumer
        run: node scripts/test-foundation-consumer.mjs --react18 ${{ matrix.node == '24' && '--browser' || '' }} 2>&1 | tee artifacts/logs/foundation-react18.txt
      - name: Packed React 19 foundation and Flight consumer
        run: node scripts/test-foundation-consumer.mjs ${{ matrix.node == '24' && '--browser' || '' }} 2>&1 | tee artifacts/logs/foundation-react19.txt
      - name: Packed React 18.3 editor consumer
        run: node scripts/test-editor-consumer.mjs --react18 2>&1 | tee artifacts/logs/editor-react18.txt
      - name: Packed React 19 editor consumer
        run: node scripts/test-editor-consumer.mjs 2>&1 | tee artifacts/logs/editor-react19.txt
      - name: Packed Next.js production and browser consumer
        if: matrix.node == '24'
        run: node scripts/test-next-consumer.mjs 2>&1 | tee artifacts/logs/next-consumer.txt
      - name: Pack validated package
        run: pnpm pack --pack-destination artifacts
      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: sgui-package-node-${{ matrix.node }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
      - name: Upload validated Storybook
        uses: actions/upload-artifact@v4
        with:
          name: sgui-storybook-node-${{ matrix.node }}
          path: storybook-static/
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser evidence
        if: always() && matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: sgui-browser-node-24
          path: |
            artifacts/browser-report/
            artifacts/browser-traces/
            artifacts/browser-results.json
            artifacts/packed-browser/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgui-validation-node-${{ matrix.node }}
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 14
